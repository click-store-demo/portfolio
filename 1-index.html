<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <title>بورتفوليو محمد</title>
    <style>
        body {
            font-family: Tahoma, Arial;
            background-color: #f0f2f5;
            margin: 0;
        }
        .cover {
            height: 200px;
            background: #1877f2;
        }
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid white;
            margin-top: -80px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
        h1 {
            color: #050505;
            margin-bottom: 5px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            padding: 8px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .primary {
            background-color: #1877f2;
            color: white;
        }
    </style>
</head>
<body>
    <div class="cover"></div>
    <div class="container">
        <img src="profile.jpg" alt="الصورة الشخصية" class="avatar">
        <h1>محمد وليد</h1>
        <p>مدرس برمجة وشغال بالذكاء الاصطناعي</p>
        <ul>
            <li>بيشتغل مدرس برمجة في كورسز زون أكاديمي</li>
            <li>ساكن في كفر الشيخ</li>
            <li>بيدرس علوم حاسب</li>
        </ul>
        <button class="btn primary">متابعة</button>
        <button class="btn">رسالة</button>
    </div>
</body>
</html>
